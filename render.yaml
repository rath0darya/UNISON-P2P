services:
  - type: web
    name: unison-p2p-signaling
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /health
    autoDeploy: true

  - type: web
    name: unison-p2p-web
    runtime: static
    plan: free
    buildCommand: echo "Static app ready"
    staticPublishPath: .
    autoDeploy: true
