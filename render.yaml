services:
  - type: web
    name: unison-p2p-signaling
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true

  - type: web
    name: unison-p2p-web
    runtime: static
    plan: free
    buildCommand: echo "Static app ready"
    staticPublishPath: .
    autoDeploy: true
