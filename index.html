<style>
:root{color-scheme:dark;--bg:#101116;--panel:#191a22;--panel2:#22232d;--line:#30313e;--text:#f5f5fa;--muted:#a4a5b7;--accent:#b9a6ff;--accent2:#8e77ef;--good:#79dfb0;--danger:#ff8298;--r:22px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#28213f 0,transparent 46%),var(--bg);color:var(--text);min-height:100dvh}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.app{width:100%;max-width:520px;min-height:100dvh;margin:auto;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom)}.topbar{height:72px;display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#393052,#201d31);border:1px solid #49405f;color:var(--accent);font-size:23px}.brand{font-size:16px;font-weight:800;letter-spacing:.13em}.tagline{font-size:11px;color:var(--muted);margin-top:3px}.status{margin-left:auto;border:1px solid #3b3a4b;border-radius:99px;padding:7px 10px;color:#c7c0e8;font-size:10px;white-space:nowrap}.content{flex:1;padding:16px 0 28px}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:750}.hero{padding:18px 4px 24px}.hero h1{font-size:clamp(32px,8vw,44px);letter-spacing:-.055em;line-height:1.05;margin:12px 0}.hero p{color:var(--muted);line-height:1.6;font-size:14px;max-width:390px}.card{background:linear-gradient(145deg,rgba(30,31,42,.97),rgba(23,24,32,.97));border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:13px;box-shadow:0 12px 36px #00000012}.card h2,.card h3{margin:0 0 7px;letter-spacing:-.025em}.card h2{font-size:19px}.card h3{font-size:15px}.sub{color:var(--muted);font-size:13px;line-height:1.55;margin:0}.actions{display:grid;gap:10px;margin-top:18px}.btn{min-height:52px;border:0;border-radius:16px;padding:13px 16px;font-weight:750;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s,filter .12s}.btn:active{transform:scale(.985)}.primary{background:var(--accent);color:#191526}.secondary{background:var(--panel2);color:var(--text);border:1px solid #3b3c4a}.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}.btn:disabled{opacity:.4;cursor:not-allowed}.features{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}.feature{background:#181922b8;border:1px solid #2c2d39;border-radius:16px;padding:13px 8px;text-align:center}.feature .ico{font-size:20px}.feature span{display:block;color:#c1c1cf;font-size:11px;line-height:1.35;margin-top:8px}.field-label{display:block;font-size:12px;color:#d4d2e0;margin:17px 0 8px;font-weight:700}.input{width:100%;min-height:52px;background:#101117;border:1px solid #3a3b4a;border-radius:14px;padding:0 14px;color:var(--text);letter-spacing:.04em}.hint{font-size:11px;color:var(--muted);line-height:1.5;margin-top:8px}.segmented{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#101117;border:1px solid var(--line);padding:5px;border-radius:15px;margin:18px 0}.segment{border:0;background:transparent;color:var(--muted);border-radius:11px;padding:11px 7px;font-size:12px;font-weight:750}.segment.active{background:#39324f;color:#e6deff}.notice{display:flex;gap:11px;background:#192a25;border:1px solid #285044;border-radius:15px;padding:13px;margin-top:15px;font-size:12px;line-height:1.5;color:#bcebd7}.notice .icon{font-size:18px}.identity-box{text-align:center;padding:25px 14px}.fingerprint{width:76px;height:76px;margin:0 auto 15px;display:grid;place-items:center;border-radius:25px;background:#2a2440;border:1px solid #50436d;font-size:32px;color:var(--accent)}.id-value{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere;font-size:14px;line-height:1.7;color:#e0d7ff;background:#111119;border:1px dashed #51476e;border-radius:13px;padding:13px;margin:14px 0}.small{font-size:11px;color:var(--muted);line-height:1.5}.row{display:flex;align-items:center;gap:12px}.row .grow{flex:1;min-width:0}.row+.row{margin-top:15px}.pill{font-size:10px;border-radius:99px;background:#29283a;color:#d7ceff;padding:6px 9px;white-space:nowrap}.divider{height:1px;background:var(--line);margin:18px 0}.empty-icon{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;background:#252435;color:var(--accent);font-size:24px;margin-bottom:14px}.bottomnav{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:rgba(17,18,24,.94);backdrop-filter:blur(18px);border-top:1px solid #30313d;padding:10px 0 calc(8px + env(safe-area-inset-bottom));margin:0 -18px;padding-left:10px;padding-right:10px}.navbtn{background:transparent;border:0;color:#9293a5;display:grid;justify-items:center;gap:5px;padding:7px 2px;font-size:10px;border-radius:12px}.navbtn .navico{font-size:20px;line-height:1}.navbtn.active{color:var(--accent);background:#28243a}.footer{text-align:center;color:#7f8092;font-size:11px;padding:16px 0 12px}.heart{color:#ff6687}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:94px;transform:translateX(-50%);width:max-content;max-width:calc(100vw - 36px);background:#e6ddff;color:#201a32;padding:12px 16px;border-radius:14px;font-size:12px;font-weight:700;box-shadow:0 10px 35px #0008;z-index:20}.scanbox{height:190px;border:1px dashed #5a4d7c;background:#171621;border-radius:20px;display:grid;place-items:center;text-align:center;margin:18px 0;padding:20px}.scan-symbol{font-size:54px;color:var(--accent);margin-bottom:12px}.top-title{font-size:24px;letter-spacing:-.04em;margin:8px 0 7px}.setting{padding:14px 0;border-bottom:1px solid var(--line)}.setting:last-child{border-bottom:0}.setting p{margin:4px 0 0;color:var(--muted);font-size:12px;line-height:1.5}
@media(min-width:700px){body{padding:28px 0}.app{min-height:calc(100dvh - 56px);border:1px solid #343440;border-radius:30px;overflow:hidden;background:rgba(16,17,22,.94);box-shadow:0 30px 100px #0008}.topbar{padding:0 18px}.content{padding:18px 18px 28px}.bottomnav{margin:0;padding-left:18px;padding-right:18px}.footer{padding-bottom:18px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

<body>
<div class="app">
<header class="topbar">
  <div class="logo" aria-hidden="true">◉</div>
  <div><div class="brand">UNISON P2P</div><div class="tagline">Private by design. Peer to peer.</div></div>
  <div class="status">● DECENTRALIZED</div>
</header>
<main class="content" id="view" aria-live="polite"></main>
<footer class="footer">Developed with <span class="heart">♥️</span> Aravind</footer>
<nav class="bottomnav" aria-label="Main navigation">
  <button class="navbtn active" data-page="home"><span class="navico">⌂</span>Home</button>
  <button class="navbtn" data-page="join"><span class="navico">⌁</span>Join</button>
  <button class="navbtn" data-page="identity"><span class="navico">◎</span>Identity</button>
  <button class="navbtn" data-page="settings"><span class="navico">⚙</span>Privacy</button>
</nav>
</div>
<div id="toast" class="toast hidden" role="status"></div>
<script>
(function(){
'use strict';
const view=document.getElementById('view');
const toastEl=document.getElementById('toast');
let page='home',joinMode='code',identity=null,toastTimer=null,peers=[],scanStream=null,scanTimer=null,activePeerId=null,messageLifetimeHours=48;const connections=new Map(),chatHistory=new Map();
const DB='unison-p2p-local',STORE='identity',PEERS='peers';
function toast(message){toastEl.textContent=message;toastEl.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.add('hidden'),3200)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openDB(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window)){reject(new Error('IndexedDB is unavailable'));return}const req=indexedDB.open(DB,2);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE);if(!db.objectStoreNames.contains(PEERS))db.createObjectStore(PEERS,{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function saveLocal(value){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(value,'primary');tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}
async function loadLocal(){try{const db=await openDB();return await new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readonly'),req=tx.objectStore(STORE).get('primary');req.onsuccess=()=>{db.close();resolve(req.result||null)};req.onerror=()=>{db.close();reject(req.error)}})}catch(e){return null}}
async function loadPeers(){try{const db=await openDB();return await new Promise((resolve,reject)=>{const tx=db.transaction(PEERS,'readonly'),req=tx.objectStore(PEERS).getAll();req.onsuccess=()=>{db.close();resolve(req.result||[])};req.onerror=()=>{db.close();reject(req.error)}})}catch(e){return []}}
async function savePeer(peer){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(PEERS,'readwrite');tx.objectStore(PEERS).put(peer);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}
function base32(bytes){const alphabet='abcdefghijklmnopqrstuvwxyz234567';let bits=0,value=0,out='';for(const b of bytes){value=(value<<8)|b;bits+=8;while(bits>=5){out+=alphabet[(value>>>(bits-5))&31];bits-=5}}if(bits>0)out+=alphabet[(value<<(5-bits))&31];return out}
async function createIdentity(){if(!window.crypto||!crypto.subtle)throw new Error('Secure cryptography requires HTTPS or localhost.');const pair=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},false,['sign','verify']);const publicJwk=await crypto.subtle.exportKey('jwk',pair.publicKey);const raw=new TextEncoder().encode(JSON.stringify({crv:publicJwk.crv,kty:publicJwk.kty,x:publicJwk.x,y:publicJwk.y}));const digest=await crypto.subtle.digest('SHA-256',raw);const id=base32(new Uint8Array(digest)).slice(0,20);const record={id,publicJwk,privateKey:pair.privateKey,createdAt:Date.now(),version:1};await saveLocal(record);identity=record;render();toast('Identity created on this device.')}
function shell(title,sub,inner){return '<section class="hero"><div class="eyebrow">YOUR PRIVATE NETWORK</div><h1 class="top-title">'+title+'</h1><p>'+sub+'</p></section>'+inner}
function home(){return shell('Talk freely.<br>Stay yours.','No phone number. No email. No central account. Start with a device-owned identity, then connect directly with people you trust.',(identity?'<section class="card"><div class="row"><div class="fingerprint" style="width:52px;height:52px;border-radius:17px;margin:0;font-size:24px">◎</div><div class="grow"><h3>Your identity is ready</h3><p class="sub">Your cryptographic identity is active on this device.</p></div><span class="pill">CREATED</span></div><div class="id-value">'+esc(identity.id)+'</div><button class="btn secondary" style="width:100%" data-action="identity">View identity</button></section>':'<section class="card"><div class="empty-icon">◎</div><h2>Start with your identity</h2><p class="sub">Create a permanent cryptographic identity on this device. No personal details required.</p><div class="actions"><button class="btn primary" data-action="create">✦ Create my identity</button><button class="btn secondary" data-action="join">⌁ Join with a code or QR</button></div></section>')+'<div class="features"><div class="feature"><div class="ico">⌑</div><span>Decentralized<br>network</span></div><div class="feature"><div class="ico">◈</div><span>End-to-end<br>encryption</span></div><div class="feature"><div class="ico">◷</div><span>48–72h<br>expiry policy</span></div></div><section class="card" style="margin-top:14px"><div class="row"><div class="grow"><h3>Temporary by default</h3><p class="sub">New chat messages expire after 48 hours in the running app. Persistent storage and background cleanup are not implemented yet.</p></div><span style="font-size:24px">⌛</span></div></section>')}
function join(){const list=peers.length?'<section class="card"><h2>Saved peers</h2><p class="sub">Peers saved on this device.</p><div class="divider"></div>'+peers.map(p=>'<div class="row"><div class="fingerprint" style="width:42px;height:42px;border-radius:14px;margin:0;font-size:20px">◎</div><div class="grow"><h3>'+esc(p.label||'Peer')+'</h3><p class="small">'+esc(p.id)+'</p></div><span class="pill">'+esc(p.status||'PENDING')+'</span><button class="btn secondary" style="min-height:38px;padding:8px 10px;font-size:11px" data-action="connect-peer" data-peer="'+esc(p.id)+'">Open</button></div>').join('')+'</section>':'<section class="card"><h3>No peers added yet</h3><p class="sub">Add a peer ID to keep it in your peer list on this device.</p></section>';return shell('Join a peer','Add a peer using their 20-character peer ID, or scan a QR invitation when supported by this browser.', '<section class="card"><div class="segmented"><button class="segment '+(joinMode==='code'?'active':'')+'" data-mode="code">⌗ Join code</button><button class="segment '+(joinMode==='qr'?'active':'')+'" data-mode="qr">▦ Scan QR</button></div><div id="join-body">'+joinBody()+'</div></section>'+list+'<p class="small" style="padding:0 6px">Adding a peer saves their ID. Open a peer to establish a signed direct WebRTC connection and exchange messages.</p>')}
function joinBody(){if(joinMode==='qr')return '<div class="scanbox" id="scanbox"><div><div class="scan-symbol">▦</div><h3>Scan peer QR</h3><p class="sub">Use your camera to read a QR containing a 20-character peer ID.</p></div></div><video id="scan-video" class="hidden" playsinline muted style="width:100%;border-radius:16px;background:#08080b"></video><div class="actions"><button class="btn secondary" data-action="start-scan">Start camera scanner</button><button class="btn ghost" data-action="stop-scan">Stop scanner</button></div><p class="hint">Requires camera permission and a browser that supports the BarcodeDetector QR API.</p>';return '<label class="field-label" for="join-code">Peer ID (20 characters)</label><input class="input" id="join-code" maxlength="24" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="e.g. abcdefghijklmnopqrst"><p class="hint">Ask your peer to share their peer ID. Adding it saves the contact; it does not connect or verify their identity yet.</p><div class="actions"><button class="btn primary" data-action="validate-code">Add peer</button></div>'}

function activePeer(){return peers.find(p=>p.id===activePeerId)||null}
function connectPage(){const p=activePeer();if(!p)return shell('Peer not found','Add a peer before opening a conversation.','<section class="card"><button class="btn secondary" data-page="join">Back to peers</button></section>');const conn=connections.get(p.id);const connected=!!(conn&&conn.dc&&conn.dc.readyState==='open');const history=(chatHistory.get(p.id)||[]).filter(m=>m.expiresAt>Date.now());chatHistory.set(p.id,history);return shell(esc(p.label||'Peer'),esc(p.id),'<section class="card"><div class="row"><div class="grow"><h3>Connection status</h3><p class="sub">'+(connected?'Direct encrypted connection is active.':'No active connection')+'</p></div><span class="pill">'+(connected?'CONNECTED':(p.status||'PENDING'))+'</span></div><p class="hint">Connection setup uses signed WebRTC offer/answer text that you exchange directly. No messaging server is used. A STUN service may help devices find a direct route; some networks may still block direct connections.</p></section>'+(connected?'<section class="card"><h2>Conversation</h2><p class="hint">Choose a 48- or 72-hour message lifetime. Messages are held in memory and removed while the app is running; background deletion is not available yet.</p><div class="segmented"><button class="segment '+(messageLifetimeHours===48?'active':'')+'" data-action="set-lifetime" data-hours="48">48 hours</button><button class="segment '+(messageLifetimeHours===72?'active':'')+'" data-action="set-lifetime" data-hours="72">72 hours</button></div><div id="chat-messages">'+history.map(m=>'<div class="card" style="padding:12px;margin:10px 0;background:#14151d"><p style="margin:0;white-space:pre-wrap;overflow-wrap:anywhere">'+esc(m.text)+'</p><p class="small" style="margin:7px 0 0">'+(m.mine?'You':'Peer')+' · expires '+esc(new Date(m.expiresAt).toLocaleTimeString())+'</p></div>').join('')+'</div><label class="field-label" for="chat-input">Message</label><input class="input" id="chat-input" maxlength="4000" placeholder="Write a message…"><div class="actions"><button class="btn primary" data-action="send-message">Send message</button><button class="btn ghost" data-action="disconnect-peer">Disconnect</button></div></section>':'<section class="card"><h2>Connect directly</h2><p class="sub">Step 1: create an offer here, then send the generated text to your peer through a channel you trust.</p><div class="actions"><button class="btn primary" data-action="make-offer">Create connection offer</button></div><label class="field-label" for="signal-output">Your offer / answer</label><textarea class="input" id="signal-output" rows="5" style="padding:12px;letter-spacing:0;resize:vertical" readonly placeholder="Generated connection data will appear here"></textarea><div class="actions"><button class="btn secondary" data-action="copy-signal">Copy connection text</button></div><div class="divider"></div><p class="sub">Step 2: paste the other person’s offer or answer below. A signed peer identity is checked against the saved peer ID.</p><label class="field-label" for="signal-input">Received connection text</label><textarea class="input" id="signal-input" rows="5" style="padding:12px;letter-spacing:0;resize:vertical" placeholder="Paste the connection text here"></textarea><div class="actions"><button class="btn secondary" data-action="accept-offer">Accept offer and create answer</button><button class="btn secondary" data-action="accept-answer">Finish connection with answer</button></div></section>')+'<p class="small" style="padding:0 6px">WebRTC encrypts the direct data channel in transit. UNISON also signs the signaling description with the device identity and checks the peer ID. This is an initial implementation, not an independently audited security protocol.</p>')}
function canonicalPublic(jwk){return JSON.stringify({crv:jwk.crv,kty:jwk.kty,x:jwk.x,y:jwk.y})}
function b64(bytes){let out='';for(const b of bytes)out+=String.fromCharCode(b);return btoa(out)}
function unb64(str){return Uint8Array.from(atob(str),c=>c.charCodeAt(0))}
async function publicId(jwk){const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(canonicalPublic(jwk)));return base32(new Uint8Array(digest)).slice(0,20)}
async function signSignal(type,to,sdp){const payload={version:1,type,id:identity.id,to,publicJwk:identity.publicJwk,sdp};const bytes=new TextEncoder().encode(JSON.stringify(payload));const signature=await crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'},identity.privateKey,bytes);return JSON.stringify({...payload,signature:b64(new Uint8Array(signature))})}
async function verifySignal(raw,expectedType){let obj;try{obj=JSON.parse(raw)}catch(e){throw new Error('That connection text is not valid JSON. Copy the complete offer or answer.')}if(!obj||obj.version!==1||obj.type!==expectedType||typeof obj.sdp!=='string'||!obj.publicJwk||!obj.signature)throw new Error('Connection text is missing required fields.');if(obj.to!==identity.id)throw new Error('This offer/answer was created for a different peer.');const derived=await publicId(obj.publicJwk);if(derived!==obj.id)throw new Error('The public key does not match the claimed peer ID.');if(obj.id!==activePeerId)throw new Error('The connection text belongs to a different saved peer.');const known=peers.find(p=>p.id===obj.id);if(!known)throw new Error('This peer ID is not in your saved peers. Add it first.');const key=await crypto.subtle.importKey('jwk',obj.publicJwk,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);const payload={version:obj.version,type:obj.type,id:obj.id,to:obj.to,publicJwk:obj.publicJwk,sdp:obj.sdp};const ok=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},key,unb64(obj.signature),new TextEncoder().encode(JSON.stringify(payload)));if(!ok)throw new Error('Identity signature verification failed. Do not accept this connection text.');return obj}
function waitIce(pc){if(pc.iceGatheringState==='complete')return Promise.resolve();return new Promise(resolve=>{const done=()=>{if(pc.iceGatheringState==='complete'){pc.removeEventListener('icegatheringstatechange',done);resolve()}};pc.addEventListener('icegatheringstatechange',done);setTimeout(resolve,12000)})}
function newPeerConnection(id){const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});const conn={pc,dc:null};connections.set(id,conn);pc.onconnectionstatechange=()=>{const p=peers.find(x=>x.id===id);if(p){p.status=pc.connectionState==='connected'?'CONNECTED':pc.connectionState.toUpperCase();savePeer(p).catch(()=>{});if(pc.connectionState==='failed'&&activePeerId===id)toast('Direct connection failed. Try a new offer or another network.')}};pc.ondatachannel=e=>setupDataChannel(id,conn,e.channel);return conn}
function setupDataChannel(id,conn,dc){conn.dc=dc;dc.onopen=()=>{const p=peers.find(x=>x.id===id);if(p){p.status='CONNECTED';savePeer(p).catch(()=>{})}if(activePeerId===id){render();toast('Direct connection is active.')}};dc.onclose=()=>{const p=peers.find(x=>x.id===id);if(p){p.status='DISCONNECTED';savePeer(p).catch(()=>{})}if(activePeerId===id)render()};dc.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.kind!=='message'||typeof m.text!=='string'||!Number.isFinite(m.sentAt)||!Number.isFinite(m.expiresAt)||m.expiresAt<=Date.now()||m.expiresAt<=m.sentAt||m.expiresAt-m.sentAt>72*60*60*1000)return;const list=chatHistory.get(id)||[];list.push({text:m.text,mine:false,sentAt:m.sentAt,expiresAt:m.expiresAt});chatHistory.set(id,list.filter(x=>x.expiresAt>Date.now()));if(activePeerId===id)render()}catch(err){}}}
async function networkAction(name){const p=activePeer();if(!p)throw new Error('Open a saved peer first.');if(!identity)throw new Error('Create your identity first.');if(name==='make-offer'){const old=connections.get(p.id);if(old)try{old.pc.close()}catch(e){}const conn=newPeerConnection(p.id);setupDataChannel(p.id,conn,conn.pc.createDataChannel('unison-chat',{ordered:true}));const offer=await conn.pc.createOffer();await conn.pc.setLocalDescription(offer);await waitIce(conn.pc);document.getElementById('signal-output').value=await signSignal('offer',p.id,conn.pc.localDescription.sdp);toast('Offer created. Copy and send it to your peer.');return}if(name==='accept-offer'){const raw=document.getElementById('signal-input').value.trim();const offer=await verifySignal(raw,'offer');const old=connections.get(p.id);if(old)try{old.pc.close()}catch(e){}const conn=newPeerConnection(p.id);await conn.pc.setRemoteDescription({type:'offer',sdp:offer.sdp});const answer=await conn.pc.createAnswer();await conn.pc.setLocalDescription(answer);await waitIce(conn.pc);document.getElementById('signal-output').value=await signSignal('answer',p.id,conn.pc.localDescription.sdp);toast('Verified offer. Send your answer back.');return}if(name==='accept-answer'){const raw=document.getElementById('signal-input').value.trim();const answer=await verifySignal(raw,'answer');const conn=connections.get(p.id);if(!conn)throw new Error('Create an offer first, then paste the peer’s answer.');await conn.pc.setRemoteDescription({type:'answer',sdp:answer.sdp});toast('Answer verified. Connecting directly…');return}if(name==='copy-signal'){const output=document.getElementById('signal-output');if(!output||!output.value)throw new Error('Create an offer or answer first.');await navigator.clipboard.writeText(output.value);toast('Connection text copied.');return}if(name==='disconnect-peer'){const conn=connections.get(p.id);if(conn)conn.pc.close();connections.delete(p.id);p.status='DISCONNECTED';await savePeer(p);render();toast('Disconnected.');return}if(name==='set-lifetime'){const hours=Number(document.querySelector('[data-action="set-lifetime"][data-hours]')?.dataset.hours);const requested=Number(document.activeElement?.dataset?.hours)||hours;if(requested!==48&&requested!==72)throw new Error('Choose 48 or 72 hours.');messageLifetimeHours=requested;render();return}if(name==='send-message'){const input=document.getElementById('chat-input');const textValue=(input.value||'').trim();const conn=connections.get(p.id);if(!textValue)return;if(!conn||!conn.dc||conn.dc.readyState!=='open')throw new Error('The direct connection is not active.');const sentAt=Date.now(),expiresAt=sentAt+messageLifetimeHours*60*60*1000;conn.dc.send(JSON.stringify({kind:'message',text:textValue,sentAt,expiresAt}));const list=chatHistory.get(p.id)||[];list.push({text:textValue,mine:true,sentAt,expiresAt});chatHistory.set(p.id,list.filter(x=>x.expiresAt>Date.now()));render();return}}
function identityPage(){return shell('Your identity','Your identity belongs to you. It is generated on your device and is not an account on a central server.', '<section class="card identity-box">'+(identity?'<div class="fingerprint">◎</div><div class="eyebrow">PERMANENT PEER ID</div><div class="id-value" id="my-id">'+esc(identity.id)+'</div><p class="small">Derived from this identity’s public key. Keep your private key safe; losing it means losing access to this identity.</p><div class="actions"><button class="btn secondary" data-action="copy-id">Copy peer ID</button><button class="btn ghost" data-action="identity-info">Identity & backup details</button></div>':'<div class="fingerprint">◎</div><h2>No identity yet</h2><p class="sub">Create one to reserve a stable identity in this browser.</p><div class="actions"><button class="btn primary" data-action="create">Create identity</button></div>')+'</section><section class="card"><h3>Identity portability</h3><p class="sub">Moving the same identity between web and Android will require a secure encrypted export/import flow. It is not implemented in this prototype.</p></section>')}
function settings(){return shell('Privacy first','Clear choices. Minimal data. No account profile.', '<section class="card"><div class="setting"><div class="row"><div class="grow"><h3>Message lifetime</h3><p>Protocol target: automatic deletion after 48 or 72 hours.</p></div><span class="pill">PLANNED</span></div></div><div class="setting"><div class="row"><div class="grow"><h3>Device data</h3><p>Your identity is held in this browser on this device.</p></div><span class="pill">ON DEVICE</span></div></div><div class="setting"><div class="row"><div class="grow"><h3>Network connections</h3><p>Direct text chat is implemented through manually exchanged WebRTC signaling text. Automatic discovery, calls, and relay fallback are not implemented.</p></div><span class="pill">NOT YET</span></div></div><div class="setting"><div class="row"><div class="grow"><h3>Remove identity from this device</h3><p>Removes this identity from this device. It cannot delete copies saved or exported elsewhere.</p></div></div><button class="btn ghost" style="width:100%;margin-top:12px" data-action="delete-identity">Remove identity</button></div></section><p class="small" style="padding:0 6px">Browser storage may be cleared by the browser or device. This prototype is not yet audited for production security.</p>')}
function render(){const pages={home,join,identity:identityPage,settings,connect:connectPage};view.innerHTML=(pages[page]||home)();document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===page));}
async function action(name,el){try{if(['make-offer','accept-offer','accept-answer','copy-signal','disconnect-peer','send-message','set-lifetime'].includes(name)){await networkAction(name);return}if(name==='connect-peer'){activePeerId=el.dataset.peer;page='connect';render();return}if(name==='create'){if(identity){toast('An identity already exists in this browser.');return}await createIdentity();return}if(name==='join'){page='join';render();return}if(name==='identity'){page='identity';render();return}if(name==='qr-info'){toast('QR pairing is not available on this browser yet.');return}if(name==='validate-code'){const input=document.getElementById('join-code');const code=(input.value||'').trim().toLowerCase().replace(/[\s-]/g,'');if(!/^[a-z2-7]{20}$/.test(code)){toast('Enter a valid 20-character peer ID using a–z and 2–7.');return}if(identity&&code===identity.id){toast('That is your own peer ID.');return}if(peers.some(p=>p.id===code)){toast('This peer is already in your list.');return}const peer={id:code,label:'Peer '+(code.slice(0,6)),status:'PENDING',addedAt:Date.now()};await savePeer(peer);peers.push(peer);render();toast('Peer saved. Connection is not active yet.');return}if(name==='start-scan'){if(!('BarcodeDetector'in window)){toast('QR scanning is not supported by this browser.');return}if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('Camera access is unavailable.');return}const detector=new BarcodeDetector({formats:['qr_code']});scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});const video=document.getElementById('scan-video');video.srcObject=scanStream;video.classList.remove('hidden');await video.play();const scan=async()=>{if(!scanStream||!video.isConnected)return;try{const codes=await detector.detect(video);if(codes.length){let raw=(codes[0].rawValue||'').trim();try{const u=new URL(raw);raw=u.searchParams.get('peer')||u.hash.slice(1)||raw}catch(e){}raw=raw.toLowerCase().replace(/[\s-]/g,'');if(/^[a-z2-7]{20}$/.test(raw)){const input=document.getElementById('join-code');joinMode='code';render();const field=document.getElementById('join-code');if(field){field.value=raw;toast('Peer ID scanned. Tap Add peer to save it.')}stopScanner();return}}}catch(e){}scanTimer=setTimeout(scan,450)};scan();return}if(name==='stop-scan'){stopScanner();toast('Camera scanner stopped.');return}if(name==='identity-info'){toast('Encrypted identity export/import is planned, not yet available.');return}if(name==='copy-id'){if(identity&&navigator.clipboard){await navigator.clipboard.writeText(identity.id);toast('Peer ID copied.')}else toast('Clipboard access requires a secure browser context.');return}if(name==='delete-identity'){if(!confirm('Remove this identity from this device? This cannot be undone by UNISON.'))return;const db=await openDB();await new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete('primary');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close();identity=null;render();toast('Identity removed from this device.');return}}catch(e){console.error(e);toast(e.message||'Something went wrong.');}}
function stopScanner(){if(scanTimer)clearTimeout(scanTimer);scanTimer=null;if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}const video=document.getElementById('scan-video');if(video){video.pause();video.srcObject=null;video.classList.add('hidden')}}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-page]');if(nav){page=nav.dataset.page;render();return}const mode=e.target.closest('[data-mode]');if(mode){joinMode=mode.dataset.mode;render();return}const button=e.target.closest('[data-action]');if(button)action(button.dataset.action,button)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.activeElement&&document.activeElement.id==='join-code')action('validate-code');if(e.key==='Enter'&&!e.shiftKey&&document.activeElement&&document.activeElement.id==='chat-input'){e.preventDefault();action('send-message')}});setInterval(()=>{for(const [id,list] of chatHistory)chatHistory.set(id,list.filter(m=>m.expiresAt>Date.now()));if(page==='connect'&&activePeerId&&connections.get(activePeerId)?.dc?.readyState==='open'){const box=document.getElementById('chat-messages');if(box){const list=chatHistory.get(activePeerId)||[];box.innerHTML=list.map(m=>'<div class="card" style="padding:12px;margin:10px 0;background:#14151d"><p style="margin:0;white-space:pre-wrap;overflow-wrap:anywhere">'+esc(m.text)+'</p><p class="small" style="margin:7px 0 0">'+(m.mine?'You':'Peer')+' · expires '+esc(new Date(m.expiresAt).toLocaleTimeString())+'</p></div>').join('')}}},60000);
(async()=>{identity=await loadLocal();peers=await loadPeers();render();if('serviceWorker'in navigator&&location.protocol!=='file:'){navigator.serviceWorker.register('./sw.js').catch(()=>{})}})();
})();
