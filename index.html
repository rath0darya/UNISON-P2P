function openDB(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window)){reject(new Error('IndexedDB is unavailable'));return}const req=indexedDB.open(DB,3);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE);if(!db.objectStoreNames.contains(PEERS))db.createObjectStore(PEERS,{keyPath:'id'});if(!db.objectStoreNames.contains(MESSAGES))db.createObjectStore(MESSAGES,{keyPath:'key'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function saveLocal(value){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(value,'primary');tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}

async function persistMessage(peerId,m){try{const key=await getMessageKey(),iv=crypto.getRandomValues(new Uint8Array(12)),cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(m.text));const row={key:peerId+':'+m.sentAt+':'+(m.mine?'1':'0')+':'+base32(crypto.getRandomValues(new Uint8Array(5))),peerId,messageId:m.messageId||'',status:m.status||(m.mine?'sent':'read'),iv:Array.from(iv),cipher:Array.from(new Uint8Array(cipher)),sentAt:m.sentAt,expiresAt:m.expiresAt,mine:!!m.mine};const db=await openDB();await new Promise((resolve,reject)=>{const tx=db.transaction(MESSAGES,'readwrite');tx.objectStore(MESSAGES).put(row);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close()}catch(e){console.warn('Could not save encrypted chat history',e)}}

function base32(bytes){const alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';let bits=0,value=0,out='';for(const b of bytes){value=(value<<8)|b;bits+=8;while(bits>=5){out+=alphabet[(value>>>(bits-5))&31];bits-=5}}if(bits>0)out+=alphabet[(value<<(5-bits))&31];return out}
async function createIdentity(){if(!window.crypto||!crypto.subtle)throw new Error('Secure cryptography requires HTTPS or localhost.');const pair=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},false,['sign','verify']);const publicJwk=await crypto.subtle.exportKey('jwk',pair.publicKey);const raw=new TextEncoder().encode(JSON.stringify({crv:publicJwk.crv,kty:publicJwk.kty,x:publicJwk.x,y:publicJwk.y}));const digest=await crypto.subtle.digest('SHA-256',raw);const id=base32(new Uint8Array(digest)).slice(0,20).toUpperCase();const record={id,publicJwk,privateKey:pair.privateKey,createdAt:Date.now(),version:1};await saveLocal(record);identity=record;render();toast('Identity created on this device.')}

necting')+'</span></header><div class="chat-state">'+(connected?'🔒 Direct encrypted connection active':'Connection not active · reconnecting automatically')+'</div><section class="call-panel hidden" id="call-panel"><div class="call-status" id="call-status"></div><div class="call-videos"><video id="remote-video" autoplay playsinline></video><video id="local-video" autoplay playsinline muted></video></div><audio id="remote-audio" autoplay playsinline></audio><div class="call-controls" id="call-controls"></div></section>'+(connected?'<div class="chat-lifetime"><span class="small">Messages expire after</span><div class="segmented"><button class="segment '+(messageLifetimeHours===48?'active':'')+'" data-action="set-lifetime" data-hours="48">48h</button><button class="segment '+(messageLifetimeHours===72?'active':'')+'" data-action="set-lifetime" data-hours="72">72h</button></div></div>':'<section class="card" id="pairing-panel"><h3>'+(signalingUrl()?'Reconnecting securely…':'Automatic connection needs setup')+'</h3><p class="sub">'+(signalingUrl()?'UNISON is trying to reconnect using the saved peer ID. Keep both devices online and check the Privacy connection setting if this takes too long.':'To connect using only a peer ID, set the public signaling service URL once in Privacy on both devices. Manual offers are no longer used.')+'</p><div class="actions"><button class="btn secondary" data-page="settings">Open Privacy settings</button><button class="btn ghost" data-action="retry-connection">Retry connection</button></div></section>')+'<div class="chat-messages" id="chat-messages">'+messages+'</div>'+(connected?'<form class="chat-compose" id="chat-form" onsubmit="return false"><input class="input" id="chat-input" maxlength="4000" placeholder="Message" aria-label="Message"><button class="btn primary chat-send" data-action="send-message" aria-label="Send message">➤</button></form>':'')+'<div class="chat-tools"><button class="btn ghost" data-action="disconnect-peer">Disconnec function canonicalPublic(jwk){return JSON.stringify({crv:jwk.crv,kty:jwk.kty,x:jwk.x,y:jwk.y})}
function b64(bytes){let out='';for(const b of bytes)out+=String.fromCharCode(b);return btoa(out)}

async function acceptCall(id){const call=callStates.get(id);if(!call||call.state!=='incoming'||!call.offer)throw new Error('There is no incoming call to accept.');if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('Calls require HTTPS and microphone/camera permissions.');const conn=connections.get(id);if(!conn||!conn.dc||conn.dc.readyState!=='open')throw new Error('The chat connection dropped. Reconnect before accepting.');const mode=call.mode,stream=await navigator.mediaDevices.getUserMedia({audio:true,video:mode==='video'});call.localStream=stream;for(const track of stream.getTracks()){const sender=conn.pc.getSenders().find(x=>x.track&&x.track.kind===track.kind);if(sender)await sender.replaceTrack(track);else conn.pc.addTrack(track,stream)}await conn.pc.setRemoteDescription({type:'offer',sdp:call.offer.sdp});const answer=await conn.pc.createAnswer();await conn.pc.setLocalDescription(answer);await waitIce(conn.pc);sendRelay(JSON.parse(await signSignal('answer',id,conn.pc.localDescription.sdp)));call.state='active';call.offer=null;render();renderCallPanel(id)}

async function ensureE2EEInit(id,conn){

function stopScanner(){if(scanTimer)clearTimeout(scanTimer);scanTimer=null;if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}const video=document.getElementById('scan-video');if(video){video.pause();video.srcObject=null;video.classList.add('hidden')}}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-page]');if(nav){page=nav.dataset.page;render();return}const mode=e.target.closest('[data-mode]');if(mode){joinMode=mode.dataset.mode;render();return}const button=e.target.closest('[data-action]');if(button){if(button.dataset.action==='send-message'&&button.form&&button.form.id==='chat-form')return;action(button.dataset.action,button)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.activeElement&&document.activeElement.id==='join-code')action('validate-code');if(e.key==='Enter'&&!e.shiftKey&&document.activeElement&&document.activeElement.id==='chat-input'){e.preventDefault();action('send-message')}});setInterval(()=>{purgeExpiredMessages();let changed=false;for(const [id,list] of chatHistory){const keep=list.filter(m=>m.expiresAt>Date.now());if(keep.length!==list.length){chatHistory.set(id,keep);changed=true}}if(changed&&page==='connect')render()},60000);
(async()=>{identity=await loadLocal();if(identity&&identity.id){identity.id=identity.id.toUpperCase();await saveLocal(identity)}const storedPeers=await loadPeers();peers=storedPeers.map(p=>({...p,id:String(p.id||'').toUpperCase()}));for(let i=0;i<storedPeers.length;i++){if(storedPeers[i].id!==peers[i].id){await savePeer(peers[i]);await deletePeer(storedPeers[i].id)}}const invitePeerRaw=new URL(location.href).searchParams.get('peer');const invitePeer=invitePeerRaw?invitePeerRaw.toUpperCase():'';if(invitePeer){page='join';joinMode='code'}await restoreMessages();await purgeExpiredMessages();render();if(identity&&signalingUrl())connectSignaling();if(invitePeer){const field=document.getElementById('join-code');if(field)field.value=invitePeer;toast('Friend invite opened. Tap Add friend to save the contact.')}if('serviceWorker'in navigator&&location.protocol!=='file:'){navigator.serviceWorker.register('./sw.js').catch(()=>{})}})();
})();
</script>
