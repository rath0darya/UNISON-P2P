<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101116">
<meta name="description" content="UNISON P2P — private, decentralized peer-to-peer communication.">
<link rel="manifest" href="./manifest.json">
<title>UNISON P2P</title>
<style>
:root{color-scheme:dark;--bg:#101116;--panel:#191a22;--panel2:#22232d;--line:#30313e;--text:#f5f5fa;--muted:#a4a5b7;--accent:#b9a6ff;--accent2:#8e77ef;--good:#79dfb0;--danger:#ff8298;--r:22px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#28213f 0,transparent 46%),var(--bg);color:var(--text);min-height:100dvh}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.app{width:100%;max-width:520px;min-height:100dvh;margin:auto;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom)}.topbar{height:72px;display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#393052,#201d31);border:1px solid #49405f;color:var(--accent);font-size:23px}.brand{font-size:16px;font-weight:800;letter-spacing:.13em}.tagline{font-size:11px;color:var(--muted);margin-top:3px}.status{margin-left:auto;border:1px solid #3b3a4b;border-radius:99px;padding:7px 10px;color:#c7c0e8;font-size:10px;white-space:nowrap}.content{flex:1;padding:16px 0 28px}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:750}.hero{padding:18px 4px 24px}.hero h1{font-size:clamp(32px,8vw,44px);letter-spacing:-.055em;line-height:1.05;margin:12px 0}.hero p{color:var(--muted);line-height:1.6;font-size:14px;max-width:390px}.card{background:linear-gradient(145deg,rgba(30,31,42,.97),rgba(23,24,32,.97));border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:13px;box-shadow:0 12px 36px #00000012}.card h2,.card h3{margin:0 0 7px;letter-spacing:-.025em}.card h2{font-size:19px}.card h3{font-size:15px}.sub{color:var(--muted);font-size:13px;line-height:1.55;margin:0}.actions{display:grid;gap:10px;margin-top:18px}.btn{min-height:52px;border:0;border-radius:16px;padding:13px 16px;font-weight:750;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s,filter .12s}.btn:active{transform:scale(.985)}.primary{background:var(--accent);color:#191526}.secondary{background:var(--panel2);color:var(--text);border:1px solid #3b3c4a}.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}.btn:disabled{opacity:.4;cursor:not-allowed}.features{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}.feature{background:#181922b8;border:1px solid #2c2d39;border-radius:16px;padding:13px 8px;text-align:center}.feature .ico{font-size:20px}.feature span{display:block;color:#c1c1cf;font-size:11px;line-height:1.35;margin-top:8px}.field-label{display:block;font-size:12px;color:#d4d2e0;margin:17px 0 8px;font-weight:700}.input{width:100%;min-height:52px;background:#101117;border:1px solid #3a3b4a;border-radius:14px;padding:0 14px;color:var(--text);letter-spacing:.04em}.hint{font-size:11px;color:var(--muted);line-height:1.5;margin-top:8px}.segmented{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#101117;border:1px solid var(--line);padding:5px;border-radius:15px;margin:18px 0}.segment{border:0;background:transparent;color:var(--muted);border-radius:11px;padding:11px 7px;font-size:12px;font-weight:750}.segment.active{background:#39324f;color:#e6deff}.notice{display:flex;gap:11px;background:#192a25;border:1px solid #285044;border-radius:15px;padding:13px;margin-top:15px;font-size:12px;line-height:1.5;color:#bcebd7}.notice .icon{font-size:18px}.identity-box{text-align:center;padding:25px 14px}.fingerprint{width:76px;height:76px;margin:0 auto 15px;display:grid;place-items:center;border-radius:25px;background:#2a2440;border:1px solid #50436d;font-size:32px;color:var(--accent)}.id-value{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere;font-size:14px;line-height:1.7;color:#e0d7ff;background:#111119;border:1px dashed #51476e;border-radius:13px;padding:13px;margin:14px 0}.small{font-size:11px;color:var(--muted);line-height:1.5}.row{display:flex;align-items:center;gap:12px}.row .grow{flex:1;min-width:0}.row+.row{margin-top:15px}.pill{font-size:10px;border-radius:99px;background:#29283a;color:#d7ceff;padding:6px 9px;white-space:nowrap}.divider{height:1px;background:var(--line);margin:18px 0}.empty-icon{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;background:#252435;color:var(--accent);font-size:24px;margin-bottom:14px}.bottomnav{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:rgba(17,18,24,.94);backdrop-filter:blur(18px);border-top:1px solid #30313d;padding:10px 0 calc(8px + env(safe-area-inset-bottom));margin:0 -18px;padding-left:10px;padding-right:10px}.navbtn{background:transparent;border:0;color:#9293a5;display:grid;justify-items:center;gap:5px;padding:7px 2px;font-size:10px;border-radius:12px}.navbtn .navico{font-size:20px;line-height:1}.navbtn.active{color:var(--accent);background:#28243a}.footer{text-align:center;color:#7f8092;font-size:11px;padding:16px 0 12px}.heart{color:#ff6687}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:94px;transform:translateX(-50%);width:max-content;max-width:calc(100vw - 36px);background:#e6ddff;color:#201a32;padding:12px 16px;border-radius:14px;font-size:12px;font-weight:700;box-shadow:0 10px 35px #0008;z-index:20}.scanbox{height:190px;border:1px dashed #5a4d7c;background:#171621;border-radius:20px;display:grid;place-items:center;text-align:center;margin:18px 0;padding:20px}.scan-symbol{font-size:54px;color:var(--accent);margin-bottom:12px}.top-title{font-size:24px;letter-spacing:-.04em;margin:8px 0 7px}.setting{padding:14px 0;border-bottom:1px solid var(--line)}.setting:last-child{border-bottom:0}.setting p{margin:4px 0 0;color:var(--muted);font-size:12px;line-height:1.5}
@media(min-width:700px){body{padding:28px 0}.app{min-height:calc(100dvh - 56px);border:1px solid #343440;border-radius:30px;overflow:hidden;background:rgba(16,17,22,.94);box-shadow:0 30px 100px #0008}.topbar{padding:0 18px}.content{padding:18px 18px 28px}.bottomnav{margin:0;padding-left:18px;padding-right:18px}.footer{padding-bottom:18px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="logo" aria-hidden="true">◉</div>
  <div><div class="brand">UNISON P2P</div><div class="tagline">Private by design. Peer to peer.</div></div>
  <div class="status">● DECENTRALIZED</div>
</header>
<main class="content" id="view" aria-live="polite"></main>
<footer class="footer">Developed with <span class="heart">♥️</span> Aravind</footer>
<nav class="bottomnav" aria-label="Main navigation">
  <button class="navbtn active" data-page="home"><span class="navico">⌂</span>Home</button>
  <button class="navbtn" data-page="join"><span class="navico">⌁</span>Join</button>
  <button class="navbtn" data-page="identity"><span class="navico">◎</span>Identity</button>
  <button class="navbtn" data-page="settings"><span class="navico">⚙</span>Privacy</button>
</nav>
</div>
<div id="toast" class="toast hidden" role="status"></div>
<script>
(function(){
'use strict';
const view=document.getElementById('view');
const toastEl=document.getElementById('toast');
let page='home',joinMode='code',identity=null,toastTimer=null;
const DB='unison-p2p-local',STORE='identity';
function toast(message){toastEl.textContent=message;toastEl.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.add('hidden'),3200)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openDB(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window)){reject(new Error('IndexedDB is unavailable'));return}const req=indexedDB.open(DB,1);req.onupgradeneeded=()=>req.result.createObjectStore(STORE);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function saveLocal(value){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(value,'primary');tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}
async function loadLocal(){try{const db=await openDB();return await new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readonly'),req=tx.objectStore(STORE).get('primary');req.onsuccess=()=>{db.close();resolve(req.result||null)};req.onerror=()=>{db.close();reject(req.error)}})}catch(e){return null}}
function base32(bytes){const alphabet='abcdefghijklmnopqrstuvwxyz234567';let bits=0,value=0,out='';for(const b of bytes){value=(value<<8)|b;bits+=8;while(bits>=5){out+=alphabet[(value>>>(bits-5))&31];bits-=5}}if(bits>0)out+=alphabet[(value<<(5-bits))&31];return out}
async function createIdentity(){if(!window.crypto||!crypto.subtle)throw new Error('Secure cryptography requires HTTPS or localhost.');const pair=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},false,['sign','verify']);const publicJwk=await crypto.subtle.exportKey('jwk',pair.publicKey);const raw=new TextEncoder().encode(JSON.stringify({crv:publicJwk.crv,kty:publicJwk.kty,x:publicJwk.x,y:publicJwk.y}));const digest=await crypto.subtle.digest('SHA-256',raw);const id=base32(new Uint8Array(digest)).slice(0,20);const record={id,publicJwk,privateKey:pair.privateKey,createdAt:Date.now(),version:1};await saveLocal(record);identity=record;render();toast('Identity created on this device.')}
function shell(title,sub,inner){return '<section class="hero"><div class="eyebrow">YOUR PRIVATE NETWORK</div><h1 class="top-title">'+title+'</h1><p>'+sub+'</p></section>'+inner}
function home(){return shell('Talk freely.<br>Stay yours.','No phone number. No email. No central account. Start with a device-owned identity, then connect directly with people you trust.',(identity?'<section class="card"><div class="row"><div class="fingerprint" style="width:52px;height:52px;border-radius:17px;margin:0;font-size:24px">◎</div><div class="grow"><h3>Your identity is ready</h3><p class="sub">Your cryptographic identity is active on this device.</p></div><span class="pill">CREATED</span></div><div class="id-value">'+esc(identity.id)+'</div><button class="btn secondary" style="width:100%" data-action="identity">View identity</button></section>':'<section class="card"><div class="empty-icon">◎</div><h2>Start with your identity</h2><p class="sub">Create a permanent cryptographic identity on this device. No personal details required.</p><div class="actions"><button class="btn primary" data-action="create">✦ Create my identity</button><button class="btn secondary" data-action="join">⌁ Join with a code or QR</button></div></section>')+'<div class="features"><div class="feature"><div class="ico">⌑</div><span>Decentralized<br>network</span></div><div class="feature"><div class="ico">◈</div><span>End-to-end<br>encryption</span></div><div class="feature"><div class="ico">◷</div><span>48–72h<br>expiry policy</span></div></div><section class="card" style="margin-top:14px"><div class="row"><div class="grow"><h3>Temporary by default</h3><p class="sub">Messages are designed to expire automatically after 48 or 72 hours. Message delivery and automatic expiry are not active in this build yet.</p></div><span style="font-size:24px">⌛</span></div></section>')}
function join(){return shell('Join a peer','Connect without signing up. Use a shareable invitation code or scan an invitation QR.', '<section class="card"><div class="segmented"><button class="segment '+(joinMode==='code'?'active':'')+'" data-mode="code">⌗ Join code</button><button class="segment '+(joinMode==='qr'?'active':'')+'" data-mode="qr">▦ Scan QR</button></div><div id="join-body">'+joinBody()+'</div></section><p class="small" style="padding:0 6px">Joining is a UI prototype at this stage. It will not establish a real peer connection until the shared P2P protocol and discovery layer are implemented.</p>')}
function joinBody(){if(joinMode==='qr')return '<div class="scanbox"><div><div class="scan-symbol">▦</div><h3>QR scanner</h3><p class="sub">Camera-based invitation scanning will be connected in a later protocol milestone.</p></div></div><button class="btn secondary" style="width:100%" data-action="qr-info">How QR pairing will work</button>';return '<label class="field-label" for="join-code">16–20 character invitation code</label><input class="input" id="join-code" maxlength="24" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="e.g. k7m2..."><p class="hint">Enter the code shared by your peer. This is an invitation, not your permanent identity.</p><div class="actions"><button class="btn primary" data-action="validate-code">Continue</button></div>'}
function identityPage(){return shell('Your identity','Your identity belongs to you. It is generated on your device and is not an account on a central server.', '<section class="card identity-box">'+(identity?'<div class="fingerprint">◎</div><div class="eyebrow">PERMANENT PEER ID</div><div class="id-value" id="my-id">'+esc(identity.id)+'</div><p class="small">Derived from this identity’s public key. Keep your private key safe; losing it means losing access to this identity.</p><div class="actions"><button class="btn secondary" data-action="copy-id">Copy peer ID</button><button class="btn ghost" data-action="identity-info">Identity & backup details</button></div>':'<div class="fingerprint">◎</div><h2>No identity yet</h2><p class="sub">Create one to reserve a stable identity in this browser.</p><div class="actions"><button class="btn primary" data-action="create">Create identity</button></div>')+'</section><section class="card"><h3>Identity portability</h3><p class="sub">Moving the same identity between web and Android will require a secure encrypted export/import flow. It is not implemented in this prototype.</p></section>')}
function settings(){return shell('Privacy first','Clear choices. Minimal data. No account profile.', '<section class="card"><div class="setting"><div class="row"><div class="grow"><h3>Message lifetime</h3><p>Protocol target: automatic deletion after 48 or 72 hours.</p></div><span class="pill">PLANNED</span></div></div><div class="setting"><div class="row"><div class="grow"><h3>Device data</h3><p>Your identity is held in this browser on this device.</p></div><span class="pill">LOCAL</span></div></div><div class="setting"><div class="row"><div class="grow"><h3>Network connections</h3><p>No live messaging, peer discovery, or calling has been connected yet.</p></div><span class="pill">NOT YET</span></div></div><div class="setting"><div class="row"><div class="grow"><h3>Remove identity from this device</h3><p>Removes this identity from this device. It cannot delete copies saved or exported elsewhere.</p></div></div><button class="btn ghost" style="width:100%;margin-top:12px" data-action="delete-identity">Remove identity</button></div></section><p class="small" style="padding:0 6px">Browser storage may be cleared by the browser or device. This prototype is not yet audited for production security.</p>')}
function render(){const pages={home,join,identity:identityPage,settings};view.innerHTML=(pages[page]||home)();document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===page));}
async function action(name,el){try{if(name==='create'){if(identity){toast('An identity already exists in this browser.');return}await createIdentity();return}if(name==='join'){page='join';render();return}if(name==='identity'){page='identity';render();return}if(name==='qr-info'){toast('QR invitations will include versioned pairing information and a temporary secret.');return}if(name==='identity-info'){toast('Encrypted identity export/import is planned, not yet available.');return}if(name==='copy-id'){if(identity&&navigator.clipboard){await navigator.clipboard.writeText(identity.id);toast('Peer ID copied.')}else toast('Clipboard access requires a secure browser context.');return}if(name==='validate-code'){const input=document.getElementById('join-code');const code=(input.value||'').replace(/[\s-]/g,'');if(code.length<16||code.length>20){toast('Enter a code containing 16–20 characters.');return}toast('Code format accepted. Peer connection is not implemented yet.');return}if(name==='delete-identity'){if(!confirm('Remove this identity from this device? This cannot be undone by UNISON.'))return;const db=await openDB();await new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete('primary');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close();identity=null;render();toast('Identity removed from this device.');return}}catch(e){console.error(e);toast(e.message||'Something went wrong.');}}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-page]');if(nav){page=nav.dataset.page;render();return}const mode=e.target.closest('[data-mode]');if(mode){joinMode=mode.dataset.mode;render();return}const button=e.target.closest('[data-action]');if(button)action(button.dataset.action,button)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.activeElement&&document.activeElement.id==='join-code')action('validate-code')});
(async()=>{identity=await loadLocal();render();if('serviceWorker'in navigator&&location.protocol!=='file:'){navigator.serviceWorker.register('./sw.js').catch(()=>{})}})();
})();
</script>
</body>
</html>
