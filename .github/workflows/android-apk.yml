name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - native-android-foundation
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: unison-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      signing_configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          KEYSTORE: ${{ secrets.UNISON_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.UNISON_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UNISON_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UNISON_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Stable signing secrets are not all configured. Debug validation will still run; publishing Download/UNISON.apk will be skipped."
          fi

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile Android debug APK and run unit tests
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: Upload debug test build
        uses: actions/upload-artifact@v4
        with:
          name: UNISON-debug-validation
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  publish-release:
    needs: [prepare, validate]
    if: needs.prepare.outputs.signing_configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore stable signing keystore
        env:
          UNISON_KEYSTORE_BASE64: ${{ secrets.UNISON_KEYSTORE_BASE64 }}
          UNISON_KEYSTORE_PASSWORD: ${{ secrets.UNISON_KEYSTORE_PASSWORD }}
          UNISON_KEY_ALIAS: ${{ secrets.UNISON_KEY_ALIAS }}
          UNISON_KEY_PASSWORD: ${{ secrets.UNISON_KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/unison-signing"
          printf '%s' "$UNISON_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/unison-signing/unison-release.jks"
          echo "UNISON_KEYSTORE_PATH=$RUNNER_TEMP/unison-signing/unison-release.jks" >> "$GITHUB_ENV"
          echo "UNISON_KEYSTORE_PASSWORD=$UNISON_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "UNISON_KEY_ALIAS=$UNISON_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "UNISON_KEY_PASSWORD=$UNISON_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Place APK in repository Download folder
        run: |
          mkdir -p Download
          cp app/build/outputs/apk/release/app-release.apk Download/UNISON.apk
          sha256sum Download/UNISON.apk | tee Download/UNISON.apk.sha256
      - name: Commit APK to repository Download folder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Download/UNISON.apk Download/UNISON.apk.sha256
          if git diff --cached --quiet; then
            echo "APK is unchanged; no commit needed."
          else
            git commit -m "Build UNISON Android APK"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
